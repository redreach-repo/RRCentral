<style>
  :root {

  html, body { margin: 0; min-height: 100%; }
  body {

      radial-gradient(800px 420px at 100% 0%, rgba(232, 93, 4, 0.12), transparent 50%),
      linear-gradient(180deg, #f7f8fa 0%, var(--bg) 45%, #e8edf2 100%);
  }

  #app {
    display: grid;
    grid-template-columns: var(--sidebar) 1fr;
    min-height: 100vh;
  }

  .sidebar {
    position: sticky; top: 0; height: 100vh;

  .brand-mark {

  .brand-name { font-weight: 700; letter-spacing: 0.08em; font-size: 13px; }
  .brand-sub { color: rgba(247,242,234,0.55); font-size: 12px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {

  .sidebar-foot {

  .sidebar-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(18,20,23,0.4); z-index: 35;
  }
  .sidebar-backdrop.show { display: block; }

  .main { padding: 20px 24px 40px; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .topbar-left { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .topbar h1 { margin: 0; font-size: clamp(1.35rem, 2.5vw, 1.9rem); font-weight: 700; letter-spacing: -0.03em; }
  .muted { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .menu-btn { display: none; }

  .global-search-wrap { position: relative; margin-bottom: 14px; }
  .global-search { max-width: none !important; width: 100%; min-height: var(--touch); }
  .search-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); max-height: 360px; overflow: auto;
  }
  .search-results .group { padding: 10px 12px 4px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .search-results button {
    width: 100%; text-align: left; border: 0; background: transparent; padding: 12px 14px;
    font: inherit; cursor: pointer; border-top: 1px solid var(--line);
  }
  .search-results button:hover { background: var(--accent-soft); }

  .btn {

    min-height: var(--touch); padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: linear-gradient(90deg, #c1121f, #e85d04); color: #fff; }
  .btn-secondary, .btn-ghost { background: var(--panel-solid); border-color: var(--line); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--bad); border-color: rgba(193,18,31,0.25); }

  .grid { display: grid; gap: 12px; }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat, .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .stat { padding: 16px; }
  .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-value { margin-top: 8px; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; }
  .stat-value.neg { color: var(--bad); }
  .stat-value.pos { color: var(--ok); }
  .panel { overflow: hidden; }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .panel-head h3 { margin: 0; font-size: 14px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .search, .select, .input, .textarea {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 10px 12px; font: inherit; color: var(--ink); min-height: var(--touch);
  }
  .search { max-width: 320px; }
  .textarea { min-height: 88px; resize: vertical; }
  label.field { display: grid; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid .full { grid-column: 1 / -1; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
  table.data th, table.data td { padding: 12px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.data th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    background: rgba(18,20,23,0.03); font-weight: 700; position: sticky; top: 0;
  }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .linkish { appearance: none; border: 0; background: transparent; color: var(--accent-2); font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
  .badge {
    display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: var(--bg-2); color: var(--muted);
  }
  .badge.ok { background: rgba(31,107,69,0.12); color: var(--ok); }
  .badge.warn { background: rgba(154,103,0,0.14); color: var(--warn); }
  .badge.bad { background: rgba(193,18,31,0.12); color: var(--bad); }
  .badge.info { background: var(--accent-soft); color: var(--accent-2); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .card-list { display: grid; gap: 10px; }
  .moq-warn {
    margin-top: 8px; padding: 10px 12px; border-radius: 12px;
    background: rgba(154,103,0,0.12); color: var(--warn); font-size: 13px; font-weight: 600;
  }

  .modal.hidden, .toast.hidden, .search-results.hidden, .autosave.hidden { display: none; }
  .modal {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    padding: 18px;
  }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(18,20,23,0.45); }
  .modal-card {
    position: relative; width: min(820px, 100%); max-height: min(92vh, 920px);
    overflow: auto; background: var(--panel-solid); border-radius: 22px;
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .modal-head, .modal-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--panel-solid); z-index: 1;
  }
  .modal-foot {
    border-bottom: 0; border-top: 1px solid var(--line); top: auto; bottom: 0;
    justify-content: flex-end; flex-wrap: wrap;
  }
  .modal-head h2 { margin: 0; font-size: 1.1rem; }
  .modal-body { padding: 16px; }
  .icon-btn {
    width: var(--touch); height: var(--touch); border-radius: 12px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 20px; line-height: 1;
  }
    .items-table { min-width: 520px !important; }
  .items-table input { min-height: 40px; }
  .totals { margin-top: 12px; display: grid; gap: 6px; justify-content: end; min-width: 220px; margin-left: auto; }
  .totals div { display: flex; justify-content: space-between; gap: 24px; }
  .totals .grand { font-weight: 700; padding-top: 6px; border-top: 1px solid var(--line); }

  .toast {
    position: fixed; right: 14px; bottom: 14px; z-index: 60;
    background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px;
    box-shadow: var(--shadow); max-width: min(360px, calc(100vw - 28px));
  }
  .toast.error { background: var(--bad); }
  .autosave {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
    z-index: 55; background: rgba(18,20,23,0.88); color: #fff; padding: 8px 14px;
    border-radius: 999px; font-size: 12px; font-weight: 700;
  }
  .loading { padding: 40px; color: var(--muted); }
  .split { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 12px; }
  .list-compact { list-style: none; margin: 0; padding: 0; }
  .list-compact li {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .update-feed li { display: block; }
  .update-feed .update-text {
    margin: 6px 0;
    white-space: pre-wrap;
    line-height: 1.45;

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline-item {
    padding: 14px 12px;
    border-left: 3px solid var(--line);
    margin-left: 6px;
    border-bottom: 1px solid var(--line);
  }
  .timeline-item:hover { background: rgba(0,0,0,0.02); }
  .timeline-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .timeline-title { font-weight: 600; }
  .timeline-detail { white-space: pre-wrap; margin-top: 4px; }

  /* Same desktop chrome on phones/tablets — sidebar slides in, tables scroll */
  @media (max-width: 1100px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split, .grid-3 { grid-template-columns: 1fr; }
  }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: min(280px, 86vw); transform: translateX(-105%);
      transition: transform 0.2s ease; height: 100%;
      padding-top: calc(18px + env(safe-area-inset-top, 0px));
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: inline-grid; place-items: center; }
    .main {
      padding: 16px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    }
    .form-grid { grid-template-columns: 1fr; }
    .search { max-width: none; width: 100%; }
    .stat { padding: 14px; }
    .stat-value { font-size: 1.25rem; }
    .topbar-actions .btn { padding: 8px 12px; font-size: 13px; }
    .modal { padding: 12px; place-items: center; }
    .modal-card {
      width: 100%;
      max-height: calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      border-radius: 18px;
    }
    table.data { font-size: 13px; min-width: 580px; }
    table.data th, table.data td { padding: 10px; }
  }

  @media (max-width: 480px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topbar { flex-direction: column; align-items: stretch; }
    .topbar-actions { justify-content: flex-start; }
  }
</style>
