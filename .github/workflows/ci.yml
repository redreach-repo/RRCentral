name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a11y:
    name: Accessibility (axe, light and dark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # No Supabase settings, so the app runs in local mode and never touches real data.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - name: Keep the accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: app/playwright-report
          retention-days: 14
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Checkout Edge Function bundle is up to date
        run: npm run build:checkout-fn -- --check
      - name: Support email Edge Function bundle is up to date
        run: npm run build:support-fn -- --check
      - run: npm run build
      - name: No service_role key in the built site
        run: npm run scan:bundle -- dist
      - name: No customer data in the published folder
        run: |
          if find public dist -name 'migration-data*.json' -o -name 'rrcentral-backup-*.json' | grep -q .; then
            echo "::error::Data dumps must never be published (app/public is public)."; exit 1
          fi
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

  edge-functions:
    name: Type-check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/zoho-proxy/index.ts supabase/functions/google-drive/index.ts supabase/functions/hubspot-sync/index.ts supabase/functions/create-checkout-session/index.ts supabase/functions/bootstrap-admin/index.ts supabase/functions/support-email-in/index.ts supabase/functions/worshiphub-read/index.ts supabase/functions/usage-import/index.ts supabase/functions/daily-digest/index.ts supabase/functions/client-portal/index.ts supabase/functions/ai-assist/index.ts supabase/functions/whatsapp-in/index.ts supabase/functions/whatsapp-send/index.ts supabase/functions/watchdog/index.ts supabase/functions/event-outbox/index.ts supabase/functions/contract-invoices/index.ts supabase/functions/payment-reminder/index.ts supabase/functions/lead-intake/index.ts supabase/functions/quote-accept/index.ts supabase/functions/legal-sign/index.ts supabase/functions/fireflies-fetch/index.ts supabase/functions/invoice-pay-link/index.ts supabase/functions/stripe-invoice-webhook/index.ts supabase/functions/client-reports/index.ts supabase/functions/client-updates/index.ts
      - name: Type-check gap plan module functions
        # Module PRs (docs/MODULE_BUILD_PLAN.md) add functions without editing
        # the list above: anything under supabase/functions/hm-*/ is checked here.
        run: |
          shopt -s nullglob
          files=(supabase/functions/hm-*/index.ts)
          if [ ${#files[@]} -gt 0 ]; then deno check "${files[@]}"; else echo "No module functions yet"; fi
      - name: Public functions check their callers
        # Every verify_jwt = false function in supabase/config.toml must refuse
        # callers without its secret, signature, link token or sign in.
        run: deno test --allow-env --allow-read --allow-net supabase/tests/functions/

  migrations:
    name: Apply migrations + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations + RLS tests
        # shell: bash adds pipefail — without it `| tee` hid every failure and CI stayed green.
        shell: bash
        run: bash supabase/tests/run.sh 2>&1 | tee /tmp/migrate-rls.log
      - name: Production data check (23 Oct catch-up) gives the right status
        shell: bash
        run: bash supabase/tests/catch_up_check_test.sh
      - name: Backup restore check
        shell: bash
        run: |
          set -euo pipefail
          pg_dump -d rr_rls_test --format=custom --no-owner --no-privileges --schema=public --schema=auth > /tmp/t.dump
          psql -X -q -d rr_rls_test -AtF $'\t' -f scripts/db/table-counts.sql > /tmp/expected.tsv
          psql -X -q -d postgres -c "create database rr_restore_check"
          cd /tmp && bash "$GITHUB_WORKSPACE/scripts/db/restore-check.sh" t.dump postgresql://postgres:postgres@localhost/rr_restore_check expected.tsv
      - name: Surface migration failure
        if: failure()
        run: |
          echo "::group::Migration / RLS log (tail)"
          tail -n 80 /tmp/migrate-rls.log || true
          echo "::endgroup::"
          # Emit lines as annotations so they are readable via the Checks API
          # even when workflow log blobs are unreachable.
          tail -n 40 /tmp/migrate-rls.log | while IFS= read -r line; do
            # Skip empty lines; escape % for workflow commands
            [ -z "$line" ] && continue
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/}
            echo "::error::${safe}"
          done


  function-health:
    name: Edge Function error logging and ping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function with the shared wrapper
        run: deno check supabase/functions/_shared/functionHealth.ts supabase/functions/worshiphub-manage/index.ts supabase/functions/manage-auth-user/index.ts
      - name: Failures reach app_errors, ping answers without running the function
        run: deno test --allow-env --allow-read --allow-net supabase/tests/functions/function_health_test.ts
