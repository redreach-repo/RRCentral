name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      # EMERGENCY 2026-10-09: do not strip secrets. Cloud data vanished when we
      # refused to embed the mis-set service_role key (app fell into Local mode).
      # Prefer anon key — assert warns but must not block deploy until secret is fixed.
      - run: npm run assert:supabase-key
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ALLOW_UNSAFE_SUPABASE_KEY: '1'
      - run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ALLOW_UNSAFE_SUPABASE_KEY: '1'
      # Staging copy at /RRCentral/staging/, built only once its own Supabase
      # project is set up (docs/STAGING.md). Never with the live project.
      - name: Build staging copy
        working-directory: app
        env:
          LIVE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_URL" ] || [ -z "$STAGING_KEY" ]; then
            echo "Staging is not set up yet, skipping."; exit 0
          fi
          if [ "${STAGING_URL%/}" = "${LIVE_URL%/}" ]; then
            echo "::error::STAGING_SUPABASE_URL is the live project. Staging needs its own Supabase project."; exit 1
          fi
          export VITE_SUPABASE_URL="$STAGING_URL" VITE_SUPABASE_ANON_KEY="$STAGING_KEY"
          npm run assert:supabase-key
          VITE_APP_ENV=staging VITE_BASE=/RRCentral/staging/ npx vite build --outDir dist-staging
          mv dist-staging dist/staging
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
