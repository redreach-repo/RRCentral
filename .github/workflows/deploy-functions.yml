# Deploys Supabase Edge Functions from GitHub, so no local copy of the repo
# is needed. Run it by hand: Actions > Deploy Edge Functions > Run workflow.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project id in the Supabase URL
#
# Verify JWT for each function comes from supabase/config.toml, as with a
# deploy from a laptop. Functions not listed there keep it on.
name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        type: choice
        default: worshiphub-read
        options:
          - worshiphub-read
          - usage-import
          - daily-digest
          - client-portal
          - ai-assist
          - whatsapp-in
          - whatsapp-send
          - support-email-in
          - create-checkout-session
          - manage-auth-user
          - bootstrap-admin
          - zoho-proxy
          - teetribe-order-sync

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FUNCTION: ${{ inputs.function }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: supabase functions deploy "$FUNCTION" --project-ref "$SUPABASE_PROJECT_REF"
