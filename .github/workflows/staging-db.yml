name: Update staging database
# Applies every migration to the STAGING Supabase project, so staging has the
# same tables as live. Run it once after creating the staging project, and
# again after merging a PR that adds SQL (before running that SQL on live).
# Never touches the live database: it refuses if the two addresses match.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type staging to confirm'
        required: true
permissions:
  contents: read
concurrency:
  group: staging-db
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      LIVE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check
        run: |
          if [ "${{ inputs.confirm }}" != "staging" ]; then echo "::error::Type staging to confirm."; exit 1; fi
          if [ -z "$STAGING_DB_URL" ]; then echo "::error::STAGING_DB_URL is not set. See docs/STAGING.md."; exit 1; fi
          host() { printf '%s' "$1" | sed -E 's#^[a-z]+://(.*@)?##; s#[/?].*$##'; }
          user() { printf '%s' "$1" | sed -E 's#^[a-z]+://##; s#[:@].*$##'; }
          # Supabase pooler addresses share a host, so compare the user too (postgres.<project ref>).
          if [ -n "$LIVE_DB_URL" ] && [ "$(host "$STAGING_DB_URL")$(user "$STAGING_DB_URL")" = "$(host "$LIVE_DB_URL")$(user "$LIVE_DB_URL")" ]; then
            echo "::error::STAGING_DB_URL points at the live database. Refusing."; exit 1
          fi
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          docker run --rm -e DB_URL="$STAGING_DB_URL" -v "$PWD:/work:ro" -w /work postgres:17 \
            bash scripts/db/migrate.sh "$STAGING_DB_URL"
