<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121417">
    <title>RED REACH Central</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        background: linear-gradient(160deg, #121417 0%, #2a2f36 55%, #1a1d22 100%);
        color: #fff; padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px; padding: 28px 24px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
      p { margin: 0 0 16px; color: rgba(255,255,255,0.72); line-height: 1.5; font-size: 14px; }
      .btn {
        display: block; width: 100%; text-align: center; text-decoration: none;
        border: 0; border-radius: 10px; padding: 13px 14px; margin-top: 10px;
        background: #e85d04; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      .btn.secondary { background: transparent; border: 1px solid rgba(255,255,255,0.22); }
      .muted { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 14px; }
      code { font-size: 12px; word-break: break-all; }
    </style>
    <script src="config.js"></script>
  </head>
  <body>
    <div class="card">
      <h1>RED REACH Central</h1>
      <p>
        The app runs on Google Apps Script (Sheets + Calendar).
        GitHub hosts this launcher page.
      </p>
      <a class="btn" id="open-app" href="#">Open RED REACH Central</a>
      <a class="btn secondary" id="open-calendar" href="#" target="_blank" rel="noopener">Connect Google Calendar</a>
      <p class="muted">
        Sign in with your Google account when prompted
        (<code id="url-hint"></code>
      </p>
    </div>
    <script>
      (function () {
        var cfg = window.RR_CONFIG || {};
        var base = String(cfg.scriptUrl || '').replace(/\/$/, '');
        if (!base) {
          document.getElementById('open-app').textContent = 'Missing scriptUrl in config.js';
          return;
        }
        document.getElementById('open-app').href = base;
        document.getElementById('open-calendar').href = base + '?page=calendar-connect';
        document.getElementById('url-hint').textContent = '';
        // Auto-open after a short beat so the GitHub URL still “hosts” entry
        var params = new URLSearchParams(location.search);
        if (params.get('auto') !== '0') {
          setTimeout(function () { location.replace(base); }, 600);
        }
      })();
    </script>
  </body>
</html>
